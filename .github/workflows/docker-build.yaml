on:
  push:
env:
  REGISTRY: docker.io
  REPOSITORY_NAME: jackhoman/whoami-server
  GITHUB_HEAD_REF: ${{ github.head_ref }}
  GITHUB_REF_NAME: ${{ github.ref }}
jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Create Image Tag
      id: image_tag
      run: |
        GITHASH=$(git rev-parse --short=12 HEAD 2> /dev/null)
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          TAG=${GITHUB_REF#refs/tags/}
          echo "IMAGE_TAG=${TAG}" >> $GITHUB_OUTPUT
          echo "BRANCH_TAG=${TAG}" >> $GITHUB_OUTPUT
        else
          if [ -n "$GITHUB_HEAD_REF" ]; then
            BRANCH=$GITHUB_HEAD_REF
          else
            BRANCH=${GITHUB_REF#refs/heads/}
          fi
          BRANCH=${BRANCH//\//-}
          echo "IMAGE_TAG=${BRANCH}-rev-${GITHASH}" >> $GITHUB_OUTPUT
          if [ "${BRANCH}" = "master" ]; then
            echo "BRANCH_TAG=latest" >> $GITHUB_OUTPUT
          else
            echo "BRANCH_TAG=${BRANCH}" >> $GITHUB_OUTPUT
          fi
        fi
        cat $GITHUB_OUTPUT
    - name: Setup docker buildx
      uses: docker/setup-buildx-action@v3
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USER }}
        password: ${{ secrets.DOCKERHUB_PASS }}
    - name: Build & Push ${{ env.REPOSITORY_NAME }} image
      uses: docker/build-push-action@
      with:
        push: true
        no-cache: false
        tags: |
          ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAME }}:${{ steps.image_tag.outputs.IMAGE_TAG }}
          ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAME }}:${{ steps.image_tag.outputs.BRANCH_TAG }}
          ${{ env.REGISTRY }}/${{ env.REPOSITORY_NAME }}:latest
        context: .
        file: ./Dockerfile
        cache-from: type=local,src=/tmp/.buildx-cache
        cache-to: type=local,dest=/tmp/.buildx-cache-new
